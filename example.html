<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro compacto</title>
  <style>
    :root {
      --bg: #11100e;
      --bg-2: #181512;
      --surface: #1d1a17;
      --surface-2: #24201c;
      --fg: #f5efe6;
      --muted: #aba295;
      --border: #343029;
      --accent: #ff8c4a;
      --accent-strong: #ff6f2f;
      --shadow: rgba(0, 0, 0, 0.42);
      --success: #68c28d;
      --warn: #f0b35b;
      --danger: #e46d6d;
      --font-display: Inter, "Segoe UI", system-ui, sans-serif;
      --font-body: Inter, "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --grid: rgba(255, 255, 255, 0.035);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(255, 140, 74, 0.08), transparent 32%),
        radial-gradient(circle at bottom left, rgba(104, 194, 141, 0.04), transparent 28%),
        linear-gradient(180deg, #0d0c0b, var(--bg));
      color: var(--fg);
      font: 16px/1.5 var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 40%, black 0%, black 55%, transparent 85%);
      opacity: 0.24;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center end;
      padding: clamp(18px, 3vw, 36px);
    }

    .widget {
      width: min(428px, calc(100vw - 36px));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 22%),
        linear-gradient(180deg, var(--surface-2), var(--surface));
      box-shadow:
        0 28px 70px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      overflow: hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .widget__topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.01);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand__mark {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      background:
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.25) 22%, transparent 24%),
        linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 0 0 1px rgba(255, 140, 74, 0.35);
      flex: 0 0 auto;
    }

    .brand__text {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand__title {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand__meta {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, color 140ms ease;
    }

    .ui-icon {
      width: 16px;
      height: 16px;
      display: block;
      stroke: currentColor;
      stroke-width: 1.85;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      color: var(--fg);
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
    }

    .icon-btn,
    .action,
    .options-toggle {
      border-radius: 12px;
    }

    .button-icon {
      width: 16px;
      height: 16px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action__icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .widget__main {
      padding: 20px 18px 16px;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .mode-pill {
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 550;
      letter-spacing: 0.02em;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, color 140ms ease;
    }

    .mode-pill:hover {
      transform: translateY(-1px);
      color: var(--fg);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .mode-pill[aria-pressed="true"] {
      color: var(--fg);
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .timer {
      display: grid;
      place-items: center;
      padding: 6px 0 10px;
    }

    .timer__ring {
      width: 248px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(21, 20, 18, 0.96) 0 61%, transparent 61.5%),
        conic-gradient(from 270deg, var(--accent) 0 var(--progress), rgba(255, 255, 255, 0.07) var(--progress) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.06),
        0 20px 36px rgba(0, 0, 0, 0.25);
      display: grid;
      place-items: center;
      position: relative;
    }

    .timer__ring::after {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .timer__content {
      display: grid;
      gap: 10px;
      text-align: center;
      z-index: 1;
    }

    .timer__label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .timer__time {
      font-family: var(--font-mono);
      font-size: clamp(46px, 7vw, 64px);
      line-height: 0.92;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }

    .timer__sub {
      font-size: 13px;
      color: var(--muted);
      max-width: 22ch;
      margin-inline: auto;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.25fr 0.9fr 0.9fr;
      gap: 8px;
      margin-top: 18px;
    }

    .action {
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      color: var(--fg);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, color 140ms ease, opacity 140ms ease;
    }

    .action:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.05);
    }

    .action--primary {
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #1b120d;
      box-shadow: 0 10px 22px rgba(255, 140, 74, 0.22);
    }

    .action--primary:hover {
      background: linear-gradient(135deg, #ff9a61, #ff7637);
    }

    .action--ghost {
      color: var(--muted);
    }

    .options-toggle {
      margin-top: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 2px 0;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .options-toggle span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .options-toggle svg {
      width: 14px;
      height: 14px;
    }

    .options {
      max-height: 0;
      overflow: hidden;
      transition: max-height 220ms ease;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      margin-top: 12px;
    }

    .widget.is-options-open .options {
      max-height: 220px;
    }

    .options__inner {
      padding: 14px 2px 2px;
      display: grid;
      gap: 12px;
    }

    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
    }

    .switch__copy {
      display: grid;
      gap: 2px;
    }

    .switch__label {
      font-size: 13px;
      font-weight: 550;
    }

    .switch__hint {
      font-size: 12px;
      color: var(--muted);
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      flex: 0 0 auto;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .toggle__icon {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .toggle__icon svg {
      width: 13px;
      height: 13px;
      stroke: rgba(245, 239, 230, 0.92);
      stroke-width: 1.85;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 180ms ease, transform 180ms ease, color 180ms ease;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: linear-gradient(180deg, #fbf5ec, #d9d1c7);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: left 180ms ease, background 180ms ease;
    }

    .toggle[aria-pressed="true"] {
      background: rgba(255, 140, 74, 0.16);
      border-color: rgba(255, 140, 74, 0.28);
    }

    .toggle[aria-pressed="true"] .toggle__icon svg {
      stroke: var(--fg);
    }

    .toggle[aria-pressed="true"]::after {
      left: 24px;
      background: linear-gradient(180deg, #ffd7c1, #ffb48b);
    }

    .widget__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--muted);
      font-size: 12px;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .kbd {
      padding: 3px 7px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(104, 194, 141, 0.12);
    }

    @media (max-width: 520px) {
      .stage {
        place-items: end center;
      }

      .widget {
        width: min(100%, 440px);
      }

      .timer__ring {
        width: 216px;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="stage" data-od-id="app-stage">
    <section class="widget" data-od-id="pomodoro-widget">
      <header class="widget__topbar" data-od-id="widget-topbar">
        <div class="brand" data-od-id="widget-brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div class="brand__text">
            <div class="brand__title">Pomodoro</div>
            <div class="brand__meta" id="mode-copy">Focus session · 25 min</div>
          </div>
        </div>

      <div class="toolbar" data-od-id="widget-toolbar">
        <button class="icon-btn" type="button" aria-label="Abrir opciones" id="options-button">
            <svg class="ui-icon button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7h14"></path>
              <circle cx="9" cy="7" r="2"></circle>
              <path d="M5 12h14"></path>
              <circle cx="15" cy="12" r="2"></circle>
              <path d="M5 17h14"></path>
              <circle cx="11" cy="17" r="2"></circle>
            </svg>
          </button>
        </div>
      </header>

      <div class="widget__main" data-od-id="widget-main">
        <div class="modes" role="tablist" aria-label="Modos de temporizador">
          <button class="mode-pill" type="button" data-mode="focus" aria-pressed="true">Focus</button>
          <button class="mode-pill" type="button" data-mode="short" aria-pressed="false">Short break</button>
          <button class="mode-pill" type="button" data-mode="long" aria-pressed="false">Long break</button>
        </div>

        <div class="timer" data-od-id="timer-block">
          <div class="timer__ring" id="ring" style="--progress: 0%">
            <div class="timer__content">
              <div class="timer__label" id="timer-label">Ready</div>
              <div class="timer__time" id="timer-value" aria-live="polite">25:00</div>
              <div class="timer__sub" id="timer-subtitle">Una ventana pequeña, clara y sin fricción.</div>
            </div>
          </div>
        </div>

        <div class="controls" data-od-id="timer-controls">
        <button class="action action--primary" type="button" id="play-button">
          <svg class="ui-icon action__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5v11l9-5.5z"></path></svg>
          <span id="play-label">Start</span>
        </button>
        <button class="action action--ghost" type="button" id="reset-button">
          <svg class="ui-icon action__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v6h-6"></path></svg>
          <span>Reset</span>
        </button>
        <button class="action action--ghost" type="button" id="skip-button">
          <svg class="ui-icon action__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l8-7z"></path><path d="M16 5v14"></path></svg>
          <span>Skip</span>
        </button>
        </div>

        <button class="options-toggle" type="button" id="options-toggle" aria-expanded="false">
          <span>
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9l6 6 6-6"></path>
            </svg>
            Opciones básicas
          </span>
          <span id="options-state">Closed</span>
        </button>

        <div class="options" id="options-panel" hidden>
          <div class="options__inner">
            <div class="switch">
              <div class="switch__copy">
                <div class="switch__label">Sound on finish</div>
                <div class="switch__hint">Un beep suave al completar el ciclo.</div>
              </div>
              <button class="toggle" type="button" id="sound-toggle" aria-pressed="true" aria-label="Activar sonido">
                <span class="toggle__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M5 15h4l5 4V5l-5 4H5z"></path>
                    <path d="M16 9a4 4 0 0 1 0 6"></path>
                    <path d="M18.5 6.5a7 7 0 0 1 0 11"></path>
                  </svg>
                </span>
              </button>
            </div>

            <div class="switch">
              <div class="switch__copy">
                <div class="switch__label">Auto next</div>
                <div class="switch__hint">Pasa al siguiente modo sin abrir otra ventana.</div>
              </div>
              <button class="toggle" type="button" id="auto-toggle" aria-pressed="true" aria-label="Activar avance automático">
                <span class="toggle__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M7 7h8a4 4 0 0 1 4 4v1"></path>
                    <path d="M17 8l2 4-4-1"></path>
                    <path d="M17 17H9a4 4 0 0 1-4-4v-1"></path>
                    <path d="M7 16l-2-4 4 1"></path>
                  </svg>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <footer class="widget__footer" data-od-id="widget-footer">
        <div class="status">
          <span class="status__dot" aria-hidden="true"></span>
          <span id="status-copy">Listo para empezar</span>
        </div>
        <div class="shortcut">
          <span class="kbd">Space</span>
          <span>Play</span>
        </div>
      </footer>
    </section>
  </main>

  <script>
    (function () {
      const durations = {
        focus: 25 * 60,
        short: 5 * 60,
        long: 15 * 60
      };

      const labels = {
        focus: "Focus session",
        short: "Short break",
        long: "Long break"
      };

      const subtitleByMode = {
        focus: "Un bloque corto, claro y sin configuración extra.",
        short: "Un descanso breve para volver con ritmo.",
        long: "Un descanso más largo para cerrar el ciclo."
      };

      const state = {
        mode: "focus",
        running: false,
        remaining: durations.focus,
        soundOn: true,
        autoNext: true,
        finished: false,
        startedAt: null,
        lastTick: performance.now()
      };

      const ring = document.getElementById("ring");
      const timerValue = document.getElementById("timer-value");
      const timerLabel = document.getElementById("timer-label");
      const timerSubtitle = document.getElementById("timer-subtitle");
      const statusCopy = document.getElementById("status-copy");
      const modeCopy = document.getElementById("mode-copy");
      const playButton = document.getElementById("play-button");
      const resetButton = document.getElementById("reset-button");
      const skipButton = document.getElementById("skip-button");
      const optionsToggle = document.getElementById("options-toggle");
      const optionsPanel = document.getElementById("options-panel");
      const optionsState = document.getElementById("options-state");
      const playLabel = document.getElementById("play-label");
      const soundToggle = document.getElementById("sound-toggle");
      const autoToggle = document.getElementById("auto-toggle");
      const optionsButton = document.getElementById("options-button");
      const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function formatTime(seconds) {
        const safe = Math.max(0, Math.floor(seconds));
        const mins = Math.floor(safe / 60);
        const secs = safe % 60;
        return `${pad(mins)}:${pad(secs)}`;
      }

      function updateProgress() {
        const total = durations[state.mode];
        const remaining = state.remaining;
        const progress = Math.max(0, Math.min(100, ((total - remaining) / total) * 100));
        ring.style.setProperty("--progress", `${progress}%`);
      }

      function updateModeUI() {
        modeButtons.forEach((button) => {
          const active = button.dataset.mode === state.mode;
          button.setAttribute("aria-pressed", String(active));
        });
        timerLabel.textContent = labels[state.mode];
        timerSubtitle.textContent = subtitleByMode[state.mode];
        modeCopy.textContent = `${labels[state.mode]} · ${Math.round(durations[state.mode] / 60)} min`;
      }

      function updateControls() {
        playLabel.textContent = state.running ? "Pause" : (state.finished ? "Resume" : "Start");
        playButton.querySelector("svg path").setAttribute("d", state.running ? "M8.5 6.5h3v11h-3zM12.5 6.5h3v11h-3z" : "M8 6.5v11l9-5.5z");
        statusCopy.textContent = state.running
          ? `Running · ${labels[state.mode]}`
          : state.finished
            ? "Cycle completed"
            : "Listo para empezar";
        soundToggle.setAttribute("aria-pressed", String(state.soundOn));
        autoToggle.setAttribute("aria-pressed", String(state.autoNext));
        optionsToggle.setAttribute("aria-expanded", String(!optionsPanel.hidden));
        optionsState.textContent = optionsPanel.hidden ? "Closed" : "Open";
        optionsToggle.querySelector("svg").style.transform = optionsPanel.hidden ? "rotate(0deg)" : "rotate(180deg)";
      }

      function render() {
        timerValue.textContent = formatTime(state.remaining);
        updateProgress();
        updateModeUI();
        updateControls();
      }

      function setMode(mode, keepRunning = false) {
        state.mode = mode;
        state.remaining = durations[mode];
        state.finished = false;
        state.startedAt = null;
        if (!keepRunning) {
          state.running = false;
        }
        render();
      }

      function tick(now) {
        const delta = Math.min(0.5, (now - state.lastTick) / 1000);
        state.lastTick = now;

        if (state.running) {
          state.remaining = Math.max(0, state.remaining - delta);
          if (state.remaining <= 0) {
            state.remaining = 0;
            state.running = false;
            state.finished = true;
            if (state.soundOn) {
              try {
                const audio = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audio.createOscillator();
                const gain = audio.createGain();
                osc.type = "sine";
                osc.frequency.value = 880;
                gain.gain.value = 0.0001;
                osc.connect(gain);
                gain.connect(audio.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.08, audio.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25);
                osc.stop(audio.currentTime + 0.28);
              } catch (_) {}
            }
            if (state.autoNext) {
              const nextMode = state.mode === "focus" ? "short" : state.mode === "short" ? "focus" : "focus";
              state.running = true;
              setMode(nextMode, true);
            }
          }
        }

        render();
        window.requestAnimationFrame(tick);
      }

      function toggleRunning() {
        if (state.remaining <= 0) {
          state.remaining = durations[state.mode];
        }
        state.running = !state.running;
        state.finished = false;
        render();
      }

      function resetTimer() {
        state.running = false;
        state.finished = false;
        state.remaining = durations[state.mode];
        render();
      }

      function skipMode() {
        const nextMode = state.mode === "focus" ? "short" : state.mode === "short" ? "focus" : "focus";
        setMode(nextMode);
      }

      function toggleOptions() {
        optionsPanel.hidden = !optionsPanel.hidden;
        document.querySelector(".widget").classList.toggle("is-options-open", !optionsPanel.hidden);
        updateControls();
      }

      function toggleSound() {
        state.soundOn = !state.soundOn;
        updateControls();
      }

      function toggleAutoNext() {
        state.autoNext = !state.autoNext;
        updateControls();
      }

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });

      playButton.addEventListener("click", toggleRunning);
      resetButton.addEventListener("click", resetTimer);
      skipButton.addEventListener("click", skipMode);
      optionsToggle.addEventListener("click", toggleOptions);
      optionsButton.addEventListener("click", toggleOptions);
      soundToggle.addEventListener("click", toggleSound);
      autoToggle.addEventListener("click", toggleAutoNext);

      window.addEventListener("keydown", (event) => {
        if (event.target && /input|textarea/i.test(event.target.tagName)) return;
        if (event.key === " " || event.key === "Spacebar") {
          event.preventDefault();
          toggleRunning();
        }
        if (event.key === "r" || event.key === "R") {
          event.preventDefault();
          resetTimer();
        }
      });

      render();
      window.requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
