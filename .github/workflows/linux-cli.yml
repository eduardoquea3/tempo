name: Linux CLI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p tempo-core -p tempo-ipc -p tempo-cli
      - run: cargo build -p tempo-cli --release
      - run: mkdir -p dist/tempo && cp target/release/tempo dist/tempo/
      - run: cp scripts/install-tempo.sh dist/install-tempo.sh && chmod +x dist/install-tempo.sh
      - run: tar -C dist -czf tempo-linux.tar.gz tempo install-tempo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-linux-cli
          path: tempo-linux.tar.gz
